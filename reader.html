<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ book["title"] }} - LibSpace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #09090f;
            color: white;
            min-height: 100vh;
        }

        /* TOP BAR */

        .topbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            background: #11111b;

            border-bottom:
                1px solid #27273a;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .author {
            color: #a1a1aa;
            font-size: 13px;
            margin-top: 4px;
        }

        /* BUTTONS */

        .controls {
            display: flex;
            gap: 8px;
        }

        .controls button,
        .back {
            border: none;

            padding: 10px 14px;

            border-radius: 8px;

            color: white;

            background: #27273a;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;
        }

        .controls button:hover,
        .back:hover {
            background: #4f46e5;
        }

        /* READER */

        .reader {
            width: 100%;
            height: calc(100vh - 70px);

            padding: 15px;

            display: flex;
            justify-content: center;

            background: #09090f;
        }

        .pdf-container {
            width: 100%;
            height: 100%;

            border-radius: 12px;

            overflow: hidden;

            background: white;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;

            border: none;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .topbar {
                height: auto;
                min-height: 70px;

                padding: 12px;

                gap: 10px;
            }

            .title {
                font-size: 15px;
            }

            .controls button,
            .back {
                padding: 8px 10px;
                font-size: 12px;
            }

            .reader {
                height: calc(100vh - 90px);
                padding: 5px;
            }

        }

    </style>

</head>


<body>


<!-- TOP BAR -->

<div class="topbar">


    <div>

        <div class="title">
            📖 {{ book["title"] }}
        </div>

        <div class="author">
            {{ book["author"] }}
        </div>

    </div>


    <div class="controls">

        <button
            onclick="zoomOut()"
        >
            −
        </button>

        <button
            onclick="zoomIn()"
        >
            +
        </button>

        <button
            onclick="fullScreen()"
        >
            ⛶
        </button>

        <a
            class="back"
            href="{{ url_for('book_details', book_id=book['id']) }}"
        >
            ← Back
        </a>

    </div>


</div>


<!-- PDF -->

<div class="reader">

    <div
        class="pdf-container"
        id="pdfContainer"
    >

        {% if book["pdf_filename"] %}

        <iframe
            id="pdfFrame"
            src="{{ url_for('open_pdf', filename=book['pdf_filename']) }}"
        >
        </iframe>

        {% else %}

        <div
            style="
                color: black;
                padding: 50px;
                text-align: center;
            "
        >

            <h2>
                📕 PDF Not Available
            </h2>

            <p>
                This book does not have a PDF yet.
            </p>

        </div>

        {% endif %}

    </div>

</div>


<script>

    let zoom = 1;


    function zoomIn() {

        zoom += 0.1;

        document.getElementById(
            "pdfFrame"
        ).style.transform =
            `scale(${zoom})`;

    }


    function zoomOut() {

        if (zoom > 0.5) {

            zoom -= 0.1;

            document.getElementById(
                "pdfFrame"
            ).style.transform =
                `scale(${zoom})`;

        }

    }


    function fullScreen() {

        const reader =
            document.getElementById(
                "pdfContainer"
            );

        if (reader.requestFullscreen) {

            reader.requestFullscreen();

        }

    }

</script>


</body>

</html>
