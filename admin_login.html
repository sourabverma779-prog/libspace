<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - LibSpace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e1b4b,
                    #581c87
                );
        }

        .login-box {

            width: 90%;
            max-width: 420px;

            padding: 40px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border:
                1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.4);

        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #9333ea
                );
        }

        button:hover {
            transform: scale(1.02);
        }

        .error {

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            background: rgba(239,68,68,0.25);

            color: #fecaca;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #c4b5fd;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="login-box">

    <h1>
        🔐 Admin Login
    </h1>

    <p class="subtitle">
        LibSpace Administration
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form
        method="POST"
        action="/admin_login"
    >

        <label>
            Admin Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >


        <label>
            Admin Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >


        <button type="submit">
            🔑 Login as Admin
        </button>

    </form>


    <a
        href="/"
        class="back"
    >
        ← Back to LibSpace
    </a>

</div>

</body>

</html>
