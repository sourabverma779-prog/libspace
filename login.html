<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LibSpace</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        📚 LibSpace
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </nav>

</header>


<main>

    <section class="auth-container">

        <div class="auth-card">

            <h1>
                👋 Welcome Back
            </h1>

            <p>
                Login to your LibSpace account
            </p>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username or Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </section>

</main>

</body>

</html>
